# Builds and publishes to PyPI when a GitHub release is created.
# Uses PyPI Trusted Publishing (OIDC), so no PyPI password or token is stored in GitHub:
# https://docs.pypi.org/trusted-publishers/
# All actions are pinned to full commit SHAs; the comment shows the matching release tag.

name: Upload Python Package

on:
  release:
    types: [created]

permissions: {}

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.15'

    - name: Install uv
      uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

    - name: Install dependencies
      run: uv sync --frozen

    - name: Build and check distribution
      run: |
        uv build
        uv run twine check dist/*

    - name: Store distribution
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: python-package-distributions
        path: dist/
        if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/puremagic
    permissions:
      id-token: write  # Required for Trusted Publishing; the only permission this job has

    steps:
    - name: Download distribution
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: python-package-distributions
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
